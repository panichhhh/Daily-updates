name: Morning Brief to LINE

on:
  schedule:
    # 00:00 UTC == 07:00 Asia/Bangkok. Runs Monday-Friday.
    # Change the time by editing this line (it is always in UTC).
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning brief
        run: python morning_brief.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # Optional overrides (uncomment to use):
          # ANTHROPIC_MODEL: claude-sonnet-4-5
          # BRIEF_TIMEZONE: Asia/Bangkok
